name: Collect SEC fundamentals
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-sec
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free parsing dependency
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Collect SEC annual financial facts (rate-limited)
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          BATCH_SIZE: '75'
          SEC_REQUEST_PAUSE: '0.40'
        run: python scripts/collect.py
      - name: Commit collected public data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/companies.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh SEC financial facts"
            git push
          fi
